name: Backend CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar Build
        run: ./mvnw -B verify
